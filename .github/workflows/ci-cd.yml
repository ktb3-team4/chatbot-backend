name: Java Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feat/env
  pull_request:
    branches:
      - main
      - develop
      - feat/env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: pom.xml

    - name: Spring Boot 빌드 (Maven)
      run: mvn clean package -DskipTests

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: . # 현재 working-directory 기준
        file: Dockerfile   # 현재 working-directory 기준
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

  # 2-1. EC2 인스턴스 목록 가져오기 (Role=backend 태그 기반)
  get-instances:
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get EC2 instances with Role=backend tag
        id: set-matrix
        run: |
          INSTANCES=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=backend" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].[PublicIpAddress,Tags[?Key==`Name`].Value|[0]]' \
            --output json)

          # JSON 배열 생성
          MATRIX=$(echo "$INSTANCES" | jq -c '[.[][] | {name: .[1], host: .[0]}]')

          if [ "$MATRIX" == "[]" ]; then
            echo "No EC2 instances found with Role=backend tag."
            exit 1
          fi

          echo "matrix={\"include\":$MATRIX}" >> $GITHUB_OUTPUT
          echo "Found backend instances: $MATRIX"

  # 2-2. 서버 배포 (CD) - Matrix를 이용한 병렬 배포
  deploy:
    needs: get-instances
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.get-instances.outputs.matrix) }}
      fail-fast: false  # 한 서버 실패해도 다른 서버 배포 계속 진행

    steps:
      - name: Deploy to ${{ matrix.name }} (${{ matrix.host }})
        uses: appleboy/ssh-action@master
        with:
          host: ${{ matrix.host }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. 최신 이미지 받기
            docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest

            # 2. 배포 폴더로 이동 (없으면 생성)
            mkdir -p ~/backend-deploy
            cd ~/backend-deploy

            # 3. docker-compose.yml 생성
            cat << EOF > docker-compose.yml
            services:
              backend:
                container_name: community-backend
                image: ${{ secrets.DOCKER_USERNAME }}/backend:latest
                ports:
                  - "5001:5001"
                  - "5002:5002"
                env_file:
                  - .env
                environment:
                  - TZ=Asia/Seoul
                restart: always
            EOF

            # 4. 컨테이너 재시작
            docker compose down || true
            docker compose up -d

            # 5. 미사용 이미지 정리
            docker image prune -f
