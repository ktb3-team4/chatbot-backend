name: Java Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feat/env
  pull_request:
    branches:
      - main
      - develop
      - feat/env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: pom.xml

    - name: Spring Boot 빌드 (Maven)
      run: mvn clean package -DskipTests

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: . # 현재 working-directory 기준
        file: Dockerfile   # 현재 working-directory 기준
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest

  # 2. 서버 배포 (CD)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 접속 및 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. 최신 이미지 받기 (태그 일치 확인: backend:latest)
            docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest
            
            # 2. 배포 폴더로 이동 (없으면 생성)
            mkdir -p /home/${{ secrets.SERVER_USER }}/backend-deploy
            cd /home/${{ secrets.SERVER_USER }}/backend-deploy
            
            # 3. docker-compose.yml 생성 (이미지 이름 일치 중요)
            cat << EOF > docker-compose.yml
            version: "3.8"
            
            services:
              backend:
                container_name: community-backend
                image: ${{ secrets.DOCKER_USERNAME }}/backend:latest
                ports:
                  - "8080:8080"
                env_file:
                  - .env
                environment:
                  - TZ=Asia/Seoul
                restart: always
            EOF
            
            # 4. 컨테이너 재시작
            docker-compose down || true
            docker-compose up -d
            
            # 5. 미사용 이미지 정리
            docker image prune -f
