name: Java Spring Boot CI/CD

on:
  push:
    branches:
      - main
      - develop
      - feat/env
  pull_request:
    branches:
      - main
      - develop
      - feat/env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: pom.xml

      - name: Maven Test (quiet)
        run: mvn -B -q test

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            echo "배포 시작"

            DEPLOY_DIR=/home/${{ secrets.SERVER_USER }}/backend-deploy
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "docker-compose.yml 생성"
            cat << EOF > docker-compose.yml
            services:
              backend:
                container_name: community-backend
                image: ${{ secrets.DOCKER_USERNAME }}/backend:latest
                env_file:
                  - .env
                ports:
                  - "8080:8080"
                environment:
                  - TZ=Asia/Seoul
                restart: always
            EOF

            echo ".env 생성"
            cat << EOF > .env
            ${{ secrets.BACKEND_ENV }}
            EOF

            echo "Docker 이미지 pull 중"
            if docker pull ${{ secrets.DOCKER_USERNAME }}/backend:latest > /dev/null 2>&1; then
              echo "이미지 pull 성공"
            else
              echo "이미지 pull 실패"
              exit 1
            fi

            echo "docker-compose 재시작 중"
            docker-compose down > /dev/null 2>&1 || true

            if docker-compose up -d > /dev/null 2>&1; then
              echo "docker-compose up -d 성공"
            else
              echo "docker-compose up -d 실패"
              echo "docker-compose ps 출력"
              docker-compose ps || true
            fi

            echo "헬스 체크 중 (http://localhost:8080/actuator/health)"
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "배포 및 헬스 체크 성공"
            else
              echo "헬스 체크 실패"
              exit 1
            fi

            docker image prune -f > /dev/null 2>&1 || true

            echo "배포 완료"
