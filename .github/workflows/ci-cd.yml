jobs:
  # 1. 빌드 및 Docker 이미지 푸시 (Job 이름을 명확하게 변경)
  build-and-push:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./chatbot-backend # Gradle/Docker 명령어를 './chatbot-backend' 폴더 기준에서 실행

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Gradle 캐시 설정

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: Spring Boot 테스트 및 빌드
      run: ./gradlew clean build

    - name: Docker Hub 로그인
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }} 

    - name: Docker 이미지 빌드 및 푸시
      uses: docker/build-push-action@v5
      with:
        context: . # 현재 working-directory 기준
        file: Dockerfile # 현재 working-directory 기준
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/backend:latest
        
  # 2. 서버 배포 (CD)
  deploy:
    needs: build-and-push # Job 이름 변경
    runs-on: ubuntu-latest
    steps:
    # ... (나머지 스크립트는 동일)